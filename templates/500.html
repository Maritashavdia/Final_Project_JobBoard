{% extends "base.html" %}

{% block content %}
<section class="container">
    <div class="error-state">
        <div class="error-illustration error-illustration-500">
            <div class="server-shape">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <span class="error-note">
                fixing it!
            </span>
        </div>

        <div class="error-code">500</div>

        <h1>Something went wrong</h1>

        <p>
            JobBoard encountered an unexpected problem.
            Please return to the homepage and try again.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-purple"
        >
            Return Home
        </a>
    </div>
</section>
{% endblock %}
