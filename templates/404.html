{% extends "base.html" %}

{% block content %}
<section class="container">
    <div class="error-state">
        <div class="error-illustration error-illustration-404">
            <div class="lost-page">
                <span class="lost-page-line"></span>
                <span class="lost-page-line short"></span>
                <span class="lost-page-dot"></span>
            </div>

            <span class="error-note">
                wrong turn?
            </span>
        </div>

        <div class="error-code">404</div>

        <h1>We couldn’t find that page</h1>

        <p>
            The page may have moved, or the address may be incorrect.
            Let’s return to the available opportunities.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-purple"
        >
            Back to Jobs
        </a>
    </div>
</section>
{% endblock %}
