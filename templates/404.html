{% extends "base.html" %}

{% block content %}
<section class="container">
    <div class="error-state">
        <div class="error-fall-illustration">
            <img
                src="{{ url_for('static', filename='images/falling-person.png') }}"
                alt="Person falling into a hole"
            >
        </div>

        <div class="error-code">404</div>

        <h1>We couldn’t find that page</h1>

        <p>
            The page may have moved, or the address may be incorrect.
            Let’s return to the available opportunities.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-green"
        >
            Back to Jobs
        </a>
    </div>
</section>
{% endblock %}
